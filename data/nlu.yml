version: "3.1"
nlu:
  - intent: saluer
    examples: |
      - Bonjour
      - Salut
      - Bonsoir
      - Salam
      - Bonjour, j'ai une question
  - intent: inscription
    examples: |
      - Comment s'inscrire ?
      - Où faire mon inscription ?
      - Je veux m'inscrire
      - Quelles sont les étapes d'inscription ?
      - Comment fonctionne l'inscription à la faculté ?
  - intent: horaires
    examples: |
      - Quels sont les horaires ?
      - Quand ouvre le service scolarité ?
      - À quelle heure ferme l'administration ?
      - Est-ce que le bureau est ouvert ?
      - Horaires du secrétariat
  - intent: documents
    examples: |
      - Quels documents faut-il fournir ?
      - Quelles sont les pièces demandées ?
      - Je dois préparer quels papiers ?
      - Liste des documents d'inscription
      - Quels justificatifs sont nécessaires ?
  - intent: contact
    examples: |
      - Comment contacter l'administration ?
      - Donnez-moi le contact
      - Je cherche le numéro de téléphone
      - Comment joindre le service scolarité ?
      - Où trouver l'email de la faculté ?
  - intent: au_revoir
    examples: |
      - Au revoir
      - Merci, à bientôt
      - Bonne journée
      - À la prochaine
      - Bye
